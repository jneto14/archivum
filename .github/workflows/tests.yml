name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: archivum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # imagick is a hard requirement of spatie/pdf-to-image, so composer
          # install fails without it — see the OCR block in config/archivum.php.
          extensions: imagick
          tools: composer:v2
          coverage: none

      # Attachment text extraction shells out to these; they are not PHP
      # extensions and composer does not bring them. Mirrors the RUN layer in
      # docker/8.5/Dockerfile — keep the two lists in step.
      - name: Install the text extraction toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-por \
            poppler-utils ghostscript

      # Ubuntu ships an ImageMagick policy that refuses to read PDFs (a
      # mitigation for CVE-2018-16509, long since fixed in Ghostscript). Without
      # this, rasterizing a scanned PDF for OCR fails on the runner only.
      - name: Allow ImageMagick to read PDFs
        run: |
          sudo sed -i 's|<policy domain="coder" rights="none" pattern="PDF" />|<policy domain="coder" rights="read\|write" pattern="PDF" />|' \
            /etc/ImageMagick-6/policy.xml || true

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
