name: release

# Publishes the production image when a version tag is pushed.
#
# Two registries on purpose. A short name like `jnweb/archivum` is only ever
# resolved against Docker Hub — Docker expands it to `docker.io/jnweb/archivum`
# and never looks anywhere else — so an image that lives only on GHCR is
# unreachable by the name people actually type. GHCR is the fallback that keeps
# working when Docker Hub's anonymous pull limit bites.
#
# Each architecture builds on its own native runner rather than under QEMU.
# `ubuntu-24.04-arm` is free for public repositories, and emulating the imagick
# compilation would take far longer than the two builds do in parallel.

on:
  push:
    tags:
      - 'v*'
  # A manual run builds both architectures without publishing anything, so the
  # image can be proven to still build without cutting a tag. It cannot push:
  # off a tag there is no version for the images to be called.
  workflow_dispatch:

permissions:
  contents: read
  # GHCR authenticates with the built-in GITHUB_TOKEN, so it needs no secret of
  # its own. Only Docker Hub uses DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: jnweb/archivum
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once and pushed by digest, with no tag. The tags are attached in
      # the `manifest` job, which is the only place that knows about both
      # architectures.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

      - name: Export the digest
        if: github.event_name == 'push'
        run: |
          digest='${{ steps.build.outputs.digest }}'
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish the manifest
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` only moves for a plain vX.Y.Z tag, so a v2.0.0-rc.1 never
      # becomes the version an unpinned install picks up.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # One manifest list per registry, assembled from the per-architecture
      # digests. Both are built from images that live on GHCR: pointing
      # imagetools at a source in another registry makes it copy the blobs
      # across, so nothing is rebuilt for Docker Hub.
      - name: Assemble and push the manifests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # Each file is named for one architecture's image digest.
          mapfile -t sources < <(printf "${GHCR_IMAGE}@sha256:%s\n" *)

          for image in "${GHCR_IMAGE}" "${DOCKERHUB_IMAGE}"; do
            mapfile -t tags < <(
              jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' \
                <<< "$DOCKER_METADATA_OUTPUT_JSON"
            )

            flags=()
            for tag in "${tags[@]}"; do
              flags+=(-t "$tag")
            done

            docker buildx imagetools create "${flags[@]}" "${sources[@]}"
          done

      - name: Show what was published
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME#v}"
