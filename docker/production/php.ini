; Archivum production PHP settings.

; Attachments are validated at 50 MB per file in StoreAttachmentRequest, and a
; batch upload sends several of them in one request. These have to leave room
; for a whole batch or PHP rejects it before Laravel ever sees it — with an
; empty $_POST rather than a validation error, which is far harder to diagnose.
upload_max_filesize = 64M
post_max_size = 512M
max_file_uploads = 40

; Rasterizing a page at 300 DPI holds an uncompressed bitmap in memory, and
; Imagick counts against PHP's limit. A4 at 300 DPI is roughly 100 MB before
; any processing.
memory_limit = 512M

; The queue worker sets its own timeout; this bounds web requests only.
max_execution_time = 120

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code in an image never changes under a running container, so stat()ing
; every file on every request buys nothing.
opcache.validate_timestamps = 0
